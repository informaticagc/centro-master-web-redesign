name: Deploy Pages

on:
  push:
    branches: [main, design]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (producción)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-main

      - name: Checkout design (preview)
        uses: actions/checkout@v4
        with:
          ref: design
          path: site-design

      - name: Ensamblar sitio combinado
        run: |
          mkdir -p _site
          cp -r site-main/web/. _site/
          mkdir -p _site/design-preview
          cp -r site-design/web/. _site/design-preview/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
